name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck
      - run: docker build -t spiderroute-check .
      - run: docker run --rm --entrypoint node spiderroute-check -e "const d = new (require('better-sqlite3'))(':memory:'); d.prepare('SELECT 1').get(); d.close()"
